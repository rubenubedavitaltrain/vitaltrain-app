name: Pruebas de seguridad de datos
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save @electric-sql/pglite@0.2.17
      - run: node supabase/tests/rls.test.mjs
